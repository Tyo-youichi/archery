# Archer Monitor — satu service (app). Database berada DI LUAR compose
# (MariaDB di host / server lain). App mengaksesnya lewat DB_HOST.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archer-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7777}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:7777}"
      # DB eksternal. Default menunjuk ke MariaDB di host (host.docker.internal).
      # Ganti ke alamat server DB bila perlu, atau set lewat file .env di samping compose.
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-archer}"
      DB_USERNAME: "${DB_USERNAME:-archer}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      # set SEED=true untuk menjalankan DemoSeeder saat start pertama
      SEED: "${SEED:-false}"
    # Agar host.docker.internal juga bisa di-resolve di Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Data yang harus persisten di luar container:
      - uploads_data:/var/www/public/uploads   # foto atlet (public/uploads/athletes)
      - storage_data:/var/www/storage          # log, cache, session Laravel
      # Untuk pengembangan (edit kode langsung tanpa rebuild), aktifkan baris ini:
      # - ./:/var/www

volumes:
  uploads_data:
  storage_data:
