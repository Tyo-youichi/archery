services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archer-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-archer}
      DB_USERNAME: ${DB_USERNAME:-archer}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SEED: ${SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [archer]

  web:
    image: nginx:1.27-alpine
    container_name: archer-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [archer]

  db:
    image: mariadb:10.11
    container_name: archer-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-archer}
      MARIADB_USER: ${DB_USERNAME:-archer}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT_HOST:-33060}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [archer]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: archer-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on: [db]
    networks: [archer]

volumes:
  db_data:

networks:
  archer:
    driver: bridge
